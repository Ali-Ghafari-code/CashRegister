version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: cashregister-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cashregister
      MYSQL_USER: cashregister
      MYSQL_PASSWORD: cashregister
      TZ: Asia/Tehran
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: cashregister-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 128M
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    container_name: cashregister-api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://cashregister:cashregister@mysql:3306/cashregister?charset=utf8mb4
      SECRET_KEY: change-me-in-production-please
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      SEED_ON_START: "1"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts

volumes:
  mysql_data:
